name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # ローカル開発と同じ pnpm 11 系にメジャー固定（m1-t1）。
          # pnpm 11 は package.json の pnpm フィールドを読まないため、
          # overrides は m1-t2 で不要と実測し撤去。allowBuilds は必要なため ci/pnpm-workspace.ci.yaml へ分離した
          version: 11

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # pnpm 11 は allowBuilds を pnpm-workspace.yaml からしか読まない。ローカルでは同ファイルが
      # workspace ルート誤認を起こすためリポジトリ直下には置かず、CI でのみ展開する（m1-t2）
      - name: Apply CI-only pnpm config
        run: cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml

      # m1-t4 暫定 override の鮮度検査（AC12a）。m9 で override とともに撤去する。
      # install の**前**に置くのが要点である。install が通ってしまってからでは、
      # 古い（あるいは未 push の）コミットに対する green を後追いでしか検出できない。
      # Test job のみで実行する（E2E job には追加しない）。E2E job は同じ CI 専用 YAML と
      # 同じ lock で --frozen-lockfile install するため、解決グラフは lock により同一である。
      - name: Verify CI-only @maplat/core ref (m1-t4)
        run: node scripts/m1-t4/verify-ci-core-ref.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run type checker
        run: pnpm typecheck

      - name: Run tests
        run: pnpm exec vitest run

      - name: Build package
        run: pnpm build

      - name: Build demo
        run: pnpm build:demo


  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # ローカル開発と同じ pnpm 11 系にメジャー固定（m1-t1）。
          # pnpm 11 は package.json の pnpm フィールドを読まないため、
          # overrides は m1-t2 で不要と実測し撤去。allowBuilds は必要なため ci/pnpm-workspace.ci.yaml へ分離した
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      # pnpm 11 は allowBuilds を pnpm-workspace.yaml からしか読まない。ローカルでは同ファイルが
      # workspace ルート誤認を起こすためリポジトリ直下には置かず、CI でのみ展開する（m1-t2）
      - name: Apply CI-only pnpm config
        run: cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm run test:e2e:ci

      - name: Upload test results on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
