name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # ローカル開発と同じ pnpm 11 系にメジャー固定。
          # pnpm 11 は package.json の pnpm フィールドを読まないため、
          # overrides は不要と実測し撤去。allowBuilds は必要なため ci/pnpm-workspace.ci.yaml へ分離した
          version: 11

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # pnpm 11 は allowBuilds を pnpm-workspace.yaml からしか読まない。ローカルでは同ファイルが
      # workspace ルート誤認を起こすためリポジトリ直下には置かず、CI でのみ展開する
      - name: Apply CI-only pnpm config
        run: cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check UI glossary
        env:
          # 用語集の関門 1・2 の比較元（PR は base、長く使うブランチ（master と release/*）への push は直前の commit）。
          # 手本の MaplatEditor が長く使うブランチの push でだけ関門をかけるのにそろえる。作業ブランチの push は
          # 直前の commit との差分に、merge で取り込んだ別のブランチの変更が入り、正本側と locale が同じ範囲に
          # 見えて偽の赤になるため、base を渡さない（訳語の検査そのものは走る。関門は PR の側で見る）
          MAPLAT_GLOSSARY_BASE: ${{ github.event.pull_request.base.sha || ((github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/release/')) && github.event.before) || '' }}
        run: node scripts/maplat-glossary-check.mjs

      - name: Run UI glossary fixtures
        run: node scripts/maplat-glossary-check-smoke.mjs

      - name: Run linter
        run: pnpm lint

      - name: Run type checker
        run: pnpm typecheck

      - name: Run tests
        run: pnpm exec vitest run

      - name: Build package
        run: pnpm build

      - name: Build demo
        run: pnpm build:demo


  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # ローカル開発と同じ pnpm 11 系にメジャー固定。
          # pnpm 11 は package.json の pnpm フィールドを読まないため、
          # overrides は不要と実測し撤去。allowBuilds は必要なため ci/pnpm-workspace.ci.yaml へ分離した
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: 'pnpm'

      # pnpm 11 は allowBuilds を pnpm-workspace.yaml からしか読まない。ローカルでは同ファイルが
      # workspace ルート誤認を起こすためリポジトリ直下には置かず、CI でのみ展開する
      - name: Apply CI-only pnpm config
        run: cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      # POI html の隔離のブラウザ E2E は事前バンドルした probe を使うため、
      # spec の実行前に probe を build する必要がある（サニタイズの E2E と同方式）。
      # これが無いと probe asset が 404 になり、前提テストが落ちる。
      - name: Build POI html isolation E2E probe
        run: pnpm run pretest:e2e:poi-html-isolation

      - name: Run E2E tests
        run: pnpm run test:e2e:ci

      # <maplat-ui>（src/element/）の e2e は playwright-element.config.ts で走る
      # （testDir ./e2e/element・testMatch /\.pw\.ts$/・workers: 1・swiftshader）。
      # 既定の playwright-ci.config.ts（testDir ./e2e）は .pw.ts を拾わないので、別の段で流す。
      - name: Run <maplat-ui> element E2E tests
        run: pnpm exec playwright test --config playwright-element.config.ts --retries=2 --forbid-only

      - name: Upload test results on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/

  deploy:
    name: Deploy demo to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && (vars.PAGES_DEPLOY_MODE == 'replace' || vars.PAGES_DEPLOY_MODE == 'coexist')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # gh-pages の push は github_token 入力で行うので checkout の資格情報は残さない
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Apply CI-only pnpm config
        run: cp ci/pnpm-workspace.ci.yaml pnpm-workspace.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build demo
        run: pnpm build:demo
      - name: Deploy demo to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-demo
          publish_branch: gh-pages
          keep_files: ${{ vars.PAGES_DEPLOY_MODE == 'coexist' }}
