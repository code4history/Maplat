name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # ローカル開発と同じ pnpm 11 系にメジャー固定（m1-t1）。
          # pnpm 11 は package.json の pnpm フィールドを読まないため、
          # overrides / allowBuilds は m1-t2 で不要と実測し撤去済み（pnpm-workspace.yaml も削除）
          version: 11

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Run type checker
        run: pnpm typecheck

      - name: Run tests
        run: pnpm exec vitest run

      - name: Build package
        run: pnpm build

      - name: Build demo
        run: pnpm build:demo


  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # ローカル開発と同じ pnpm 11 系にメジャー固定（m1-t1）。
          # pnpm 11 は package.json の pnpm フィールドを読まないため、
          # overrides / allowBuilds は m1-t2 で不要と実測し撤去済み（pnpm-workspace.yaml も削除）
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm run test:e2e:ci

      - name: Upload test results on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
