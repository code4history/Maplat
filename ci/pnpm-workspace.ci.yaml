# CI 専用の pnpm 設定（m1-t2）
#
# なぜリポジトリ直下の pnpm-workspace.yaml ではなくここに置くか:
#   pnpm 11 は allowBuilds を pnpm-workspace.yaml からしか読まない（package.json の
#   pnpm フィールドも .npmrc も効かないことを実測）。しかし pnpm-workspace.yaml が
#   リポジトリ直下に存在すると、pnpm はそのディレクトリを workspace ルートと判定する
#   （packages: の有無は無関係。実測）。ローカル開発では superproject（Maplats）が
#   workspace ルートであり、リポジトリ内で pnpm run を1回実行しただけで単独 install が
#   走って内部パッケージの symlink が壊れる。
#
#   CI は各リポジトリを単独 clone するため workspace ルートになって困らない。そこで
#   ファイル名を pnpm が読まないものにしてコミットし、CI の install 直前に
#   pnpm-workspace.yaml へコピーする。
#
# 中身の出自: CI と同条件（CI=true・--no-ignore-scripts・単独 clone 相当）で
#   pnpm install を実行し、ERR_PNPM_IGNORED_BUILDS が報告したパッケージを全数採録した。
#   増減した場合は同じ手順で測り直すこと。

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  less: true

overrides:
  # 12 月トレインの PR の間だけ: @maplat/core の未公開の入口（/element・/common・/conformance）を、
  # GitHub の MaplatCore の commit から入れる（Core は dist/ を追跡し prepare を持たないので、pnpm は build せず
  # files で pack したものを置く）。#93 の評価の置き換え（lodash.template → Quyuan）と、POI のテンプレートで
  # qy-swiper・qy-swiper-slide を許す sanitizer を入れた Core の commit を指す。RC（release/1.3）で package.json を
  # ^1.3.0-rc.1 に書き換えるとき、この行を消して lock を作り直す。
  "@maplat/core": "github:code4history/MaplatCore#642fda6915bdb889e9bd0febe03bc0e8e0262dd3"
  # eslint / vitest まわりが引く js-yaml。>=4.0.0 <4.3.1 の high。4系の最新へ留める。
  js-yaml: "^4.3.1"
  # ajv > fast-uri ほか。>=3.0.0 <3.1.5 の high。
  fast-uri: "^3.1.5"
  # ビルド系各所が引く postcss。<8.5.23 の high。8系の最新へ留める。
  postcss: "^8.5.23"

  # postcss > nanoid。<3.3.18 の high（CVE-2026-67213）。3系の最新へ留める。
  # 正本: scripts/m1-t3/overrides.json（outer）。ここは その部分集合である
  nanoid: "^3.3.18"
# ---- 恒久 override（m1-t3）----
# 第三者依存の脆弱性。上流の更新を待つしかないため恒久。
# audit の下限（>=X）ではなく系列を留める spec を書くこと（>=X だと未検証の上位メジャーを引く）。
#   例: path-to-regexp は page@1.11.6 が 1.x API 前提のため ~1.9.0 に留める（>=1.9.0 だと 8.4.2 へ解決して壊れる）。
#
# brace-expansion（GHSA-q2hr-2g5m-vwhr 等）: nov26-m9-t2 で再評価した（2026-10）。
#   lock の解決版は 5.x（minimatch 10 系が ^5.0.2／^5.0.8 で引く）と 2.x（minimatch 9・5 系が ^2.0.x）だけで、
#   修正版 5.0.12・2.1.7 はどちらも引いている側の範囲の中にある ∴ lock の再解決で閉じた。override しない。
#   旧注記の前提（require("brace-expansion") を関数として呼ぶ minimatch 3.x）は lock に存在しない。
  path-to-regexp: "~1.9.0"

# 自組織パッケージは publisher が我々自身のため、pnpm 11 既定の 24h 隔離
# （minimumReleaseAge=1440・サプライチェーン保護）の対象外とする。第三者依存への
# 保護は既定のまま維持する。リリーストレインの publish 直後に CI が自パッケージを
# 解決できるようにする恒久設定（m9-t0。rc1 publish 直後の全 CI が
# ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION で停止した実測に基づく）
minimumReleaseAgeExclude:
  - "@maplat/*"
  - "@c4h/*"
