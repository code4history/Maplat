# CI 専用の pnpm 設定（m1-t2）
#
# なぜリポジトリ直下の pnpm-workspace.yaml ではなくここに置くか:
#   pnpm 11 は allowBuilds を pnpm-workspace.yaml からしか読まない（package.json の
#   pnpm フィールドも .npmrc も効かないことを実測）。しかし pnpm-workspace.yaml が
#   リポジトリ直下に存在すると、pnpm はそのディレクトリを workspace ルートと判定する
#   （packages: の有無は無関係。実測）。ローカル開発では superproject（Maplats）が
#   workspace ルートであり、リポジトリ内で pnpm run を1回実行しただけで単独 install が
#   走って内部パッケージの symlink が壊れる。
#
#   CI は各リポジトリを単独 clone するため workspace ルートになって困らない。そこで
#   ファイル名を pnpm が読まないものにしてコミットし、CI の install 直前に
#   pnpm-workspace.yaml へコピーする。
#
# 中身の出自: CI と同条件（CI=true・--no-ignore-scripts・単独 clone 相当）で
#   pnpm install を実行し、ERR_PNPM_IGNORED_BUILDS が報告したパッケージを全数採録した。
#   増減した場合は同じ手順で測り直すこと。

allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  less: true
