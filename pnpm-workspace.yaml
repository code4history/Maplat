packages:
  - "."

# 依存の上書き。pnpm 11 は package.json の pnpm フィールドを一切読まないため、
# ここが唯一の正本(m1-t1 で実測。旧 package.json 側は削除済み)
overrides:
  "@microsoft/api-extractor": 7.58.0

# build script 許可リスト。pnpm 11 で onlyBuiltDependencies(リスト形式)は
# allowBuilds(マップ形式)に置換された(旧キーは警告なしで無視される)。
# pnpm 10 以前で開く場合に備えて旧形式も併記する(CI/ローカルとも 11 系)
allowBuilds:
  esbuild: true
  sass: true
  workbox-build: true
onlyBuiltDependencies:
  - esbuild
  - sass
  - workbox-build

# FOSS4Gリリーストレイン: @maplat/core(git参照)の依存に@c4h/weiwudi(git参照)が
# 含まれるため、意図的にexotic subdepsを許可する(FOSS4G前のnpm一斉publish後に戻す)
blockExoticSubdeps: false
